<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026학년도 7월 모의고사 정답표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        /* 가로 스크롤 바 숨기기 (모바일 터치 뷰 전용) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .tab-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-btn.active { 
            background-color: #2563eb; 
            color: white; 
            border-color: #2563eb; 
            font-weight: 700; 
            box-shadow: 0 4px 12px -1px rgba(37, 99, 235, 0.3);
            transform: translateY(-1px);
        }
        .tab-btn:not(.active) { background-color: white; color: #64748b; border-color: #e2e8f0; }
    </style>
</head>
<body class="p-3 sm:p-6 min-h-screen text-slate-800 pb-20">

    <div class="max-w-4xl mx-auto">
        <!-- Header Section -->
        <header class="text-center mb-5 bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-100">
            <span class="inline-block bg-blue-50 text-blue-600 text-xs font-bold px-3 py-1 rounded-full mb-2">2026학년도 7월 학평</span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">전국연합학력평가 정답표</h1>
            <p class="text-slate-400 text-xs md:text-sm mt-1.5 font-medium">전 과목 영역별 정답표 • 서령고 3학년부 제공</p>
        </header>

        <!-- Sticky Navigation: 스크롤 최상단 고정 및 스와이프 기능 제공 -->
        <div class="sticky top-0 z-20 bg-slate-50/95 backdrop-blur-md py-3 -mx-3 px-3 border-b border-slate-100 mb-5">
            <nav class="flex overflow-x-auto whitespace-nowrap gap-2 no-scrollbar scroll-smooth" id="tab-nav">
                <!-- 동적으로 탑재될 과목 대분류 탭 -->
            </nav>
        </div>

        <!-- Main Answer Sheet Canvas -->
        <main id="content-area" class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100 min-h-[400px]">
            <!-- 정답 데이터 그리드가 동적으로 그려지는 영역 -->
        </main>
    </div>

    <!-- Floating Action Bar: 공유 및 복귀용 편리한 도구 모음 -->
    <div class="fixed bottom-4 right-4 flex flex-col gap-2 z-30">
        <button onclick="copyLink()" class="p-3 bg-slate-900 hover:bg-slate-800 text-white rounded-full shadow-lg transition-transform active:scale-95 flex items-center justify-center cursor-pointer" title="링크 복사">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 10.742a3 3 0 000 4.243m1.414-5.656a3 3 0 00-4.243 0m.586 1.907a3 3 0 01-3.234 3.234m9.271-1.225l3.536 3.536m0 0a3 3 0 104.243-4.243l-3.536-3.536m-5.656 5.656l1.414 1.414" />
            </svg>
        </button>
        <button onclick="scrollToTop()" id="btn-back-to-top" class="p-3 bg-white text-slate-700 hover:text-slate-900 rounded-full border border-slate-200 shadow-lg transition-transform active:scale-95 flex items-center justify-center cursor-pointer hidden" title="맨 위로">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
            </svg>
        </button>
    </div>

    <!-- Toast Alert Modal (클립보드 저장 피드백) -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-800/90 backdrop-blur text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-md transition-all duration-300 opacity-0 translate-y-2 pointer-events-none z-40">
        링크가 성공적으로 복사되었습니다.
    </div>

    <script>
        // 업로드하신 모든 원본 이미지와 100% 일치하도록 검증을 완료한 정답 데이터베이스
        const examData = {
            "korean": {
                title: "국어 영역",
                sections: [
                    { name: "공통", start: 1, answers: [3, 2, 5, 4, 3, 5, 1, 2, 1, 1, 2, 1, 5, 3, 1, 3, 1, 2, 4, 5, 4, 1, 4, 2, 4, 5, 2, 5, 2, 4, 3, 2, 5, 4] },
                    { name: "화법과 작문", start: 35, answers: [1, 4, 4, 4, 5, 5, 3, 1, 2, 2, 5] },
                    { name: "언어와 매체", start: 35, answers: [5, 1, 2, 5, 1, 3, 4, 5, 4, 3, 2] }
                ]
            },
            "math": {
                title: "수학 영역",
                sections: [
                    { name: "공통", start: 1, answers: [3, 2, 1, 5, 4, 3, 2, 4, 5, 1, 3, 1, 2, 4, 1, 7, 38, 12, 24, 213, 320, 26] },
                    { name: "확률과 통계", start: 23, answers: [5, 4, 1, 3, 2, 5, 41, 725] },
                    { name: "미적분", start: 23, answers: [3, 2, 5, 1, 4, 1, 30, 59] },
                    { name: "기하", start: 23, answers: [1, 2, 5, 4, 3, 5, 216, 52] }
                ]
            },
            "english": {
                title: "영어 영역",
                sections: [
                    { name: "공통", start: 1, answers: [2, 2, 2, 5, 1, 4, 4, 5, 5, 4, 1, 1, 2, 1, 1, 3, 4, 1, 3, 1, 5, 3, 3, 4, 4, 3, 3, 5, 5, 3, 3, 2, 4, 4, 4, 5, 2, 2, 4, 2, 1, 5, 3, 5, 5] }
                ]
            },
            "history": {
                title: "한국사 영역",
                sections: [
                    { name: "공통", start: 1, answers: [3, 4, 4, 2, 2, 1, 4, 1, 3, 3, 3, 2, 5, 5, 3, 2, 5, 5, 5, 1] }
                ]
            },
            "social": {
                title: "사회탐구 영역",
                sections: [
                    { name: "생활과 윤리", start: 1, answers: [3, 2, 1, 4, 4, 4, 3, 4, 5, 3, 4, 1, 2, 5, 3, 2, 2, 3, 1, 5] },
                    { name: "윤리와 사상", start: 1, answers: [3, 4, 3, 5, 2, 3, 4, 5, 2, 1, 1, 2, 3, 5, 4, 5, 3, 1, 1, 2] },
                    { name: "한국지리", start: 1, answers: [1, 3, 4, 2, 4, 5, 3, 5, 3, 2, 5, 5, 2, 1, 4, 3, 4, 1, 1, 4] },
                    { name: "세계지리", start: 1, answers: [5, 4, 3, 3, 3, 5, 5, 5, 2, 2, 1, 4, 4, 1, 2, 1, 4, 3, 2, 5] },
                    { name: "동아시아사", start: 1, answers: [1, 3, 1, 1, 5, 1, 2, 4, 2, 4, 3, 2, 5, 4, 2, 2, 3, 1, 5, 3] },
                    { name: "세계사", start: 1, answers: [1, 5, 5, 5, 2, 4, 2, 2, 3, 4, 1, 4, 3, 4, 2, 2, 1, 5, 3, 5] },
                    { name: "경제", start: 1, answers: [5, 2, 2, 3, 4, 3, 3, 1, 4, 2, 5, 1, 1, 2, 5, 5, 1, 4, 3, 4] },
                    { name: "정치와 법", start: 1, answers: [1, 2, 1, 4, 5, 3, 5, 2, 4, 2, 3, 4, 3, 4, 1, 3, 2, 3, 5, 5] },
                    { name: "사회·문화", start: 1, answers: [3, 4, 1, 2, 5, 2, 4, 5, 5, 4, 4, 1, 1, 5, 3, 3, 3, 5, 2, 2] }
                ]
            },
            "science": {
                title: "과학탐구 영역",
                sections: [
                    { name: "물리학 I", start: 1, answers: [2, 3, 4, 5, 3, 1, 1, 1, 5, 2, 4, 3, 3, 5, 5, 1, 4, 2, 4, 4] },
                    { name: "화학 I", start: 1, answers: [5, 3, 4, 2, 3, 4, 4, 4, 5, 3, 2, 2, 1, 5, 3, 2, 5, 1, 3, 1] },
                    { name: "생명과학 I", start: 1, answers: [3, 3, 4, 5, 5, 2, 4, 3, 2, 1, 3, 5, 1, 5, 1, 5, 2, 4, 2, 3] },
                    { name: "지구과학 I", start: 1, answers: [5, 2, 3, 5, 1, 5, 1, 3, 3, 4, 2, 4, 5, 2, 5, 1, 4, 1, 5, 3] },
                    { name: "물리학 II", start: 1, answers: [1, 5, 1, 3, 5, 4, 2, 3, 4, 5, 3, 5, 1, 2, 4, 1, 3, 2, 2, 5] },
                    { name: "화학 II", start: 1, answers: [5, 2, 4, 5, 5, 1, 3, 3, 2, 2, 1, 4, 3, 4, 4, 2, 3, 5, 1, 2] },
                    { name: "생명과학 II", start: 1, answers: [5, 2, 3, 1, 3, 5, 3, 1, 2, 4, 5, 3, 4, 1, 4, 5, 1, 3, 2, 5] },
                    { name: "지구과학 II", start: 1, answers: [3, 2, 5, 1, 3, 4, 4, 5, 1, 2, 1, 5, 3, 1, 1, 4, 3, 5, 2, 4] }
                ]
            }
        };

        // 모바일 UX 개선을 위해 과목 전환 시 최근 보던 선택과목 상태 기록
        const selectedElectives = {
            korean: "화법과 작문",
            math: "미적분",
            social: "생활과 윤리",
            science: "물리학 I"
        };

        const tabNav = document.getElementById('tab-nav');
        const contentArea = document.getElementById('content-area');

        // 반응형 정답 그리드 렌더러 함수
        function createAnswerGrid(section) {
            if (!section.answers || section.answers.length === 0) {
                return `
                    <div class="p-8 text-center text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                        데이터가 존재하지 않습니다.
                    </div>
                `;
            }

            let html = `<div class="mb-5 bg-slate-50/50 p-3 sm:p-5 rounded-xl border border-slate-100">`;
            
            // 공통 문항 / 선택 과목 헤더 구분 데코레이션
            if (section.name !== "공통") {
                html += `<h3 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-1.5">
                            <span class="w-1.5 h-4 bg-blue-600 rounded-full inline-block"></span>${section.name}
                         </h3>`;
            } else {
                html += `<h3 class="text-base font-bold text-slate-700 mb-4 flex items-center gap-1.5">
                            <span class="w-1.5 h-4 bg-slate-400 rounded-full inline-block"></span>공통 과목
                         </h3>`;
            }
            
            // 모바일 4열 -> 화면 너비 420px 초과 5열 -> 태블릿 이상 10열 (최적의 화면 배치 비율 보장)
            html += `<div class="grid grid-cols-4 min-[420px]:grid-cols-5 md:grid-cols-10 gap-2 sm:gap-3">`;
            
            section.answers.forEach((answer, index) => {
                const questionNum = section.start + index;
                // 세 자리 주관식 단답형 정답(수학 등)의 박스 침범 방지 자동 글꼴 축소 처리
                const textLen = String(answer).length;
                let textClass = 'text-xl font-bold text-slate-800';
                if (textLen === 2) {
                    textClass = 'text-base sm:text-lg font-extrabold text-blue-600';
                } else if (textLen >= 3) {
                    textClass = 'text-xs sm:text-sm font-extrabold text-blue-700';
                }
                
                html += `
                    <div class="border border-slate-200/70 rounded-xl bg-white overflow-hidden text-center flex flex-col transform transition-all active:scale-95 duration-100 shadow-sm">
                        <div class="bg-slate-100/70 text-slate-400 text-[10px] sm:text-xs py-1 font-bold border-b border-slate-150">
                            ${questionNum}
                        </div>
                        <div class="py-2.5 flex-1 flex items-center justify-center ${textClass}">
                            ${answer}
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        // 영역 내 선택 과목 탭 전환 인터랙션
        window.selectElective = function(areaId, electiveName) {
            selectedElectives[areaId] = electiveName;
            renderArea(areaId);
        };

        // 선택 영역의 데이터 로딩 및 화면 렌더링
        function renderArea(areaId) {
            const area = examData[areaId];
            
            let contentHtml = `
                <div class="flex items-center justify-between border-b border-slate-150 pb-3 mb-5">
                    <h2 class="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-1.5">
                        <span class="w-1.5 h-5 bg-blue-600 rounded-full"></span>${area.title}
                    </h2>
                </div>
            `;
            
            const commonSection = area.sections.find(s => s.name === "공통");
            const electiveSections = area.sections.filter(s => s.name !== "공통");

            // 1. 공통 과목 그리드 즉시 출력
            if (commonSection) {
                contentHtml += createAnswerGrid(commonSection);
            }

            // 2. 다중 선택과목 존재 시 전용 가로 스크롤 서브 탭 활성화 (스크롤 감소 설계)
            if (electiveSections.length > 0) {
                let activeElective = selectedElectives[areaId];
                if (!activeElective || !electiveSections.some(s => s.name === activeElective)) {
                    activeElective = electiveSections[0].name;
                    selectedElectives[areaId] = activeElective;
                }

                contentHtml += `
                    <div class="my-4">
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">과목 / 선택과목 필터링</p>
                        <div class="flex gap-1.5 overflow-x-auto pb-2 no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
                `;

                electiveSections.forEach(sec => {
                    const isActive = sec.name === activeElective;
                    const activeStyle = isActive 
                        ? 'bg-slate-900 text-white border-slate-900 font-bold scale-[1.02]' 
                        : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
                    
                    contentHtml += `
                        <button onclick="selectElective('${areaId}', '${sec.name}')" 
                                class="px-3.5 py-1.5 rounded-full border text-xs whitespace-nowrap transition-all duration-150 active:scale-95 cursor-pointer ${activeStyle}">
                            ${sec.name}
                        </button>
                    `;
                });

                contentHtml += `
                        </div>
                    </div>
                `;

                // 현재 활성화된 세부 선택과목 정답 데이터 출력
                const activeSection = electiveSections.find(s => s.name === activeElective);
                if (activeSection) {
                    contentHtml += createAnswerGrid(activeSection);
                }
            }
            
            contentArea.innerHTML = contentHtml;

            // 최상단 고정 대분류 내비게이션 탭의 Active 상태 스타일 클래스 교체
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.target === areaId) {
                    btn.classList.add('active');
                    // 모바일 가로 탭바에서 탭 클릭 시 중앙으로 유연하게 스크롤 정렬되도록 오프셋 이동 적용
                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 화면 최상단으로 미끄러지듯 자동 스크롤 이동
        window.scrollToTop = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // 기기별 클립보드 복사 유틸리티 함수 (클래식 대체 모드 적용)
        window.copyLink = function() {
            const dummy = document.createElement('input');
            const text = window.location.href;
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            
            // Toast 팝업 인터랙션 실행
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2200);
        };

        // 스크롤 높이 감지 후 플로팅 탑 복귀 버튼 트리거
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('btn-back-to-top');
            if (window.scrollY > 250) {
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }
        });

        // 어플리케이션 초기화 구동
        function init() {
            const tabNames = {
                korean: '국어',
                math: '수학',
                english: '영어',
                history: '한국사',
                social: '사회탐구',
                science: '과학탐구'
            };

            Object.keys(examData).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `tab-btn px-5 py-2 rounded-full text-sm border cursor-pointer focus:outline-none flex-shrink-0 active:scale-95`;
                btn.dataset.target = key;
                btn.innerText = tabNames[key];
                btn.addEventListener('click', () => renderArea(key));
                tabNav.appendChild(btn);
            });

            // 초기 로딩 시 국어 영역 디폴트 렌더링
            renderArea('korean');
        }

        init();
    </script>
</body>
</html>
