<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 3월 모의고사 정답표</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f1f5f9; }
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; font-weight: 700; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .tab-btn:not(.active) { background-color: white; color: #475569; border-color: #cbd5e1; }
        .tab-btn:not(.active):hover { background-color: #f8fafc; border-color: #94a3b8; }
        .answer-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; }
        @media (min-width: 768px) { .answer-grid { grid-template-columns: repeat(10, 1fr); gap: 0.75rem; } }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen text-slate-800">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8 bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-3">2026학년도 3월 전국연합학력평가</h1>
            <p class="text-slate-500 text-lg">서령고 학생들 수고했습니다!</p>
        </header>

        <!-- Navigation Tabs -->
        <nav class="flex flex-wrap justify-center gap-2 mb-8" id="tab-nav">
            <!-- Tabs generated by JS -->
        </nav>

        <!-- Content Area -->
        <main id="content-area" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 min-h-[500px]">
            <!-- Subject Content generated by JS -->
        </main>
    </div>

    <script>
        // 검증된 전체 원본 데이터 (Raw Data)
        const examData = {
            "korean": {
                title: "국어 영역",
                sections: [
                    { name: "공통", start: 1, answers: [5,4,2,5,1, 1,3,3,2,4, 2,3,2,5,1, 4,1,1,3,5, 5,4,5,3,3, 5,1,4,2,3, 2,4,1,2] },
                    { name: "화법과 작문", start: 35, answers: [1,5,4,5,3, 4,4,3,2,5, 4] },
                    { name: "언어와 매체", start: 35, answers: [2,5,4,3,1, 4,2,5,4,3, 3] }
                ]
            },
            "math": {
                title: "수학 영역",
                sections: [
                    { name: "공통", start: 1, answers: [3,5,1,2,5, 4,4,1,3,2, 5,1,5,2,3, 30,15,124,14,67, 48,80] },
                    { name: "확률과 통계", start: 23, answers: [2,4,1,3,5, 3,864,100] },
                    { name: "미적분", start: 23, answers: [3,4,1,2,5, 3,11,57] },
                    { name: "기하", start: 23, answers: [1,3,2,4,5, 3,12,52] }
                ]
            },
            "english": {
                title: "영어 영역",
                sections: [
                    { name: "공통", start: 1, answers: [1,5,1,4,3, 4,5,4,4,1, 2,2,5,3,2, 3,4,1,1,1, 3,5,1,1,2, 5,5,5,4,2, 5,2,3,3,3, 4,2,3,5,2, 1,4,2,3,4] }
                ]
            },
            "history": {
                title: "한국사 영역",
                sections: [
                    { name: "공통", start: 1, answers: [2,4,2,1,1, 4,1,1,4,5, 3,2,5,4,5, 1,5,3,3,4] }
                ]
            },
            "social": {
                title: "사회탐구 영역",
                sections: [
                    { name: "생활과 윤리", start: 1, answers: [4,5,3,3,3, 2,1,1,1,3, 3,2,5,2,4, 5,4,1,2,1] },
                    { name: "윤리와 사상", start: 1, answers: [5,2,3,5,5, 4,4,2,1,3, 1,2,2,3,3, 3,1,4,4,4] },
                    { name: "한국지리", start: 1, answers: [2,3,3,2,2, 1,5,5,3,4, 5,3,4,5,2, 1,4,1,1,3] },
                    { name: "세계지리", start: 1, answers: [3,3,1,3,4, 5,2,3,4,2, 5,3,1,4,1, 4,1,5,2,1] },
                    { name: "동아시아사", start: 1, answers: [4,3,2,2,4, 4,3,3,2,3, 1,2,1,1,3, 4,5,1,5,5] },
                    { name: "세계사", start: 1, answers: [2,5,2,5,5, 4,3,5,3,4, 3,4,3,1,1, 1,2,4,5,4] },
                    { name: "경제", start: 1, answers: [2,4,3,3,5, 2,5,4,1,5, 1,5,3,3,4, 2,5,4,4,1] },
                    { name: "정치와 법", start: 1, answers: [5,3,2,5,1, 3,3,4,2,5, 2,4,4,1,1, 4,5,5,1,4] },
                    { name: "사회·문화", start: 1, answers: [4,1,4,2,3, 1,5,5,3,5, 4,5,4,3,1, 5,3,2,3,2] }
                ]
            },
            "science": {
                title: "과학탐구 영역",
                sections: [
                    { name: "물리학 I", start: 1, answers: [3,1,4,5,3, 1,2,3,4,5, 3,2,4,5,3, 1,2,1,4,5] },
                    { name: "화학 I", start: 1, answers: [1,5,4,3,2, 3,4,2,5,3, 4,2,1,4,5, 2,1,5,3,2] },
                    { name: "생명과학 I", start: 1, answers: [5,4,2,2,4, 3,3,4,4,3, 1,5,2,5,2, 5,1,3,5,1] },
                    { name: "지구과학 I", start: 1, answers: [1,3,4,5,3, 1,3,2,5,4, 5,2,1,5,4, 3,2,2,1,5] }
                ]
            }
        };

        const tabNav = document.getElementById('tab-nav');
        const contentArea = document.getElementById('content-area');

        // 정답 그리드 HTML 생성
        function createAnswerGrid(section) {
            let html = `<div class="mb-10 bg-slate-50 p-5 rounded-xl border border-slate-100">`;
            
            // 과목명 타이틀
            if (section.name !== "공통") {
                html += `<h3 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
                            <span class="w-2 h-6 bg-blue-600 rounded-full inline-block"></span>${section.name}
                         </h3>`;
            } else {
                html += `<h3 class="text-xl font-bold text-slate-700 mb-5 flex items-center gap-2">
                            <span class="w-2 h-6 bg-slate-400 rounded-full inline-block"></span>공통 문항
                         </h3>`;
            }
            
            html += `<div class="answer-grid">`;
            
            section.answers.forEach((answer, index) => {
                const questionNum = section.start + index;
                // 주관식 대비 폰트 사이즈 조절
                const textSize = String(answer).length > 1 ? 'text-lg md:text-xl' : 'text-2xl';
                
                html += `
                    <div class="border border-slate-200 rounded-lg shadow-sm bg-white overflow-hidden text-center flex flex-col transform transition hover:-translate-y-1 hover:shadow-md">
                        <div class="bg-slate-100 text-slate-500 text-xs py-1.5 font-semibold border-b border-slate-200">
                            ${questionNum}
                        </div>
                        <div class="py-3 font-bold ${textSize} text-slate-800 flex-1 flex items-center justify-center">
                            ${answer}
                        </div>
                    </div>
                `;
            });
            
            html += `</div></div>`;
            return html;
        }

        // 특정 영역 콘텐츠 렌더링
        function renderArea(areaId) {
            const area = examData[areaId];
            let contentHtml = `<h2 class="text-2xl md:text-3xl font-bold mb-8 text-slate-800 border-b-2 border-slate-200 pb-4">${area.title}</h2>`;
            
            // 여러 과목이 있는 경우 (탐구 영역 등) 2단 컬럼 적용 (데스크탑)
            if (area.sections.length > 4) {
                contentHtml += `<div class="grid grid-cols-1 xl:grid-cols-2 gap-x-8">`;
                area.sections.forEach(section => {
                    contentHtml += createAnswerGrid(section);
                });
                contentHtml += `</div>`;
            } else {
                area.sections.forEach(section => {
                    contentHtml += createAnswerGrid(section);
                });
            }
            
            contentArea.innerHTML = contentHtml;

            // 탭 스타일 업데이트
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.dataset.target === areaId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 초기화
        function init() {
            const tabNames = {
                korean: '국어',
                math: '수학',
                english: '영어',
                history: '한국사',
                social: '사회탐구',
                science: '과학탐구'
            };

            Object.keys(examData).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `tab-btn px-6 py-3 rounded-full text-base border cursor-pointer focus:outline-none`;
                btn.dataset.target = key;
                btn.innerText = tabNames[key];
                btn.addEventListener('click', () => renderArea(key));
                tabNav.appendChild(btn);
            });

            // 초기 로딩 시 국어 영역 표시
            renderArea('korean');
        }

        init();
    </script>
</body>
</html>
